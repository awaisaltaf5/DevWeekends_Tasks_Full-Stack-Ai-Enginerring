<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 60" fill="none">
  <!-- Stethoscope / Cross Icon Mark -->
  <g transform="translate(10, 5)">
    <!-- Cross background shape -->
    <path d="M 12,25 C 12,21.686 14.686,19 18,19 L 24,19 L 24,13 C 24,9.686 26.686,7 30,7 L 30,7 C 33.314,7 36,9.686 36,13 L 36,19 L 42,19 C 45.314,19 48,21.686 48,25 L 48,25 C 48,28.314 45.314,31 42,31 L 36,31 L 36,37 C 36,40.314 33.314,43 30,43 L 30,43 C 26.686,43 24,40.314 24,37 L 24,31 L 18,31 C 14.686,31 12,28.314 12,25 Z" fill="#0066FF" opacity="0.15"/>
    
    <!-- Stethoscope loops -->
    <path d="M 20,12 C 20,12 22,22 30,26 C 38,22 40,12 40,12" stroke="#0066FF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 30,26 C 30,34 23,44 30,47 C 37,44 30,34 30,26 Z" stroke="#40E0D0" stroke-width="3.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Stethoscope tips -->
    <circle cx="20" cy="12" r="2.5" fill="#0066FF"/>
    <circle cx="40" cy="12" r="2.5" fill="#0066FF"/>
    
    <!-- Heart in center -->
    <path d="M 30,19 C 28.5,17 25.5,18 26,20.5 C 26.5,23 30,25 30,25 C 30,25 33.5,23 34,20.5 C 34.5,18 31.5,17 30,19 Z" fill="#0066FF"/>
  </g>

  <!-- "Docly" Typography -->
  <text x="75" y="41" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="34" font-weight="700" fill="#1A2B3D" letter-spacing="-0.5">Docly</text>
</svg>
